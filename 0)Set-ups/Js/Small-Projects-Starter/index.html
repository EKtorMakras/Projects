<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <!-- Styles linked here, not imported from JS, so the page never renders unstyled -->
    <link
      rel="stylesheet"
      href="./src/scss/style.scss"
    />

    <script
      src="./src/js/main.js"
      type="module"
    ></script>
    <title>Starting Project</title>
  </head>

  <body>
    <div class="page">
      <header class="header">
        <strong>Starting Project</strong>
        <button
          id="theme-btn"
          class="theme-btn"
          type="button"
        >
          Change theme
        </button>
      </header>

      <main class="main">
        <section class="intro">
          <h1>Start here</h1>
          <p class="intro__lead">
            Write your styles in <code>src/scss</code> with the kit (<code>@use "settings" as kit;</code>) and your
            scripts in <code>src/js</code>.
          </p>
        </section>
      </main>

      <footer class="footer">
        <p>&copy; 2026 Your Company</p>
      </footer>
    </div>
  </body>
</html>
