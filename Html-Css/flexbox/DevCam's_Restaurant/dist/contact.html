<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- font-awesome -->
    <link rel="stylesheet" href="./fontawesome/css/all.min.css" />

    <!-- CSS  -->
    <link rel="stylesheet" href="css/main.css">

    <title>Contact Us</title>

</head>


<body>

    <!--* ---------------------* Header *--------------------- -->

    <header class="header header-skewed">

        <div class="header-skewed__bg header-skewed__bg--contact">
            &nbsp;
        </div>


        <div class="header-skewed__wrapper">

            <div class="header-skewed__content">

                <div class="header-skewed__heading-wrapper">
                    <h1 class="header-skewed__heading">Menu</h1>
                </div>


                <nav class="nav-menu">

                    <ul class="nav__list nav-menu__list">

                        <li class="nav__item nav-menu__item">
                            <a href="index.html" class="nav__link nav-menu__link">Home</a>
                        </li>

                        <li class="nav__item nav-menu__item">
                            <a href="menu.html" class="nav__link nav-menu__link">About</a>
                        </li>

                        <li class="nav__item nav-menu__item">
                            <a href="menu.html" class="nav__link nav-menu__link">Menu</a>
                        </li>

                        <li class="nav__item nav-menu__item">
                            <a href="contact.html" class="nav__link nav-menu__link">Contact</a>
                        </li>

                    </ul>

                </nav>
            </div>
        </div>

    </header>

    <!--* ---------------------* End Of Header *--------------------- -->


    <!--* ---------------------* Main *--------------------- -->

    <main class="main">

        <!--# ---------- Container ----------  -->

        <div class="container">

            <section class="contact">

                <!--` --- Sidebar --- -->
                <div class="contact__sidebar">

                    <!-- Logo -->
                    <div class="contact__logo-container">
                        <img src="./img/logos/decamp-fantastic-fries-logo-dark.png" alt="" class="contact__logo">
                    </div>


                    <!-- Details -->
                    <div class="contact__details">

                        <div class="contact__details--group">

                            <span class="icon contact__icon">
                                <i class="fas fa-map-marker-alt"></i>
                            </span>

                            <p class="contact__details--address">
                                2717 Walker KeysInlet
                            </p>

                        </div>


                        <div class="contact__details--group">

                            <span class="icon contact__icon">
                                <i class="fas fa-phone-volume"></i>
                            </span>

                            <p class="contact__details--phone">
                                (594) 967-8145
                            </p>

                        </div>

                        <div class="contact__details--group">

                            <span class="icon contact__icon">
                                <i class="fas fa-clock"></i>
                            </span>

                            <p class="contact__details--hours">
                                10AM - Midnight
                            </p>

                        </div>
                    </div>



                </div>
                <!--` --- End Of Sidebar --- -->


                <!--` --- Form --- -->

                <form action="" class="form">

                    <div class="form__group">
                        <input type="text" name="name" id="name" class="form__input" placeholder="Your name">
                        <label for="name" class="form__label">Your Name</label>
                    </div>

                    <div class="form__group">
                        <input type="text" name="email" id="email" class="form__input" placeholder="Your email">
                        <label for="email" class="form__label">Your email</label>
                    </div>

                    <div class="form__group">
                        <textarea name="message" id="message" placeholder="Your message"
                            class="form__message"></textarea>


                        <label for="email" class="form__label">Your message</label>
                    </div>

                    <div class="btn-wrapper form__btn-wrapper">
                        <button class="btn form__btn" type="submit">Submit</button>
                    </div>
                </form>
                <!--` --- End Of Form --- -->

            </section>


        </div>

        <!--# ---------- End Of Container ----------  -->

    </main>

    <!--* ---------------------* End Of Main *--------------------- -->



    <!--* ---------------------* Footer *--------------------- -->

    <footer class="footer">

        <!--` Footer logo  -->
        <div class="footer__logo-container">
            <img src="./img/logos/decamp-fantastic-fries-logo-white.png" alt="footer-logo" class="footer__logo">
        </div>
        <!--` ---  -->


        <!--` Contact info  -->
        <div class="footer__contact-info">
            <span class="footer__contact-info--phone">(594) 967-8145</span>
            <span class="footer__contact-info--hours">10 am - Midnight</span>
        </div>

        <!--` ---  -->



        <!--` Links  -->
        <ul class="footer__list">

            <li class="footer__item">
                <a href="index.html" class="footer__link">Home</a>
            </li>

            <li class="footer__item">
                <a href="about.html" class="footer__link">About</a>
            </li>

            <li class="footer__item">
                <a href="menu.html" class="footer__link">Menu</a>
            </li>

            <li class="footer__item">
                <a href="contact.html" class="footer__link">Contact</a>
            </li>

        </ul>

        <!--` ---  -->



        <!--` Social  -->
        <div class="footer__social">

            <a href="https://www.instagram.com/" class="footer__social-link">
                <span class="footer__social-icon">
                    <i class="fab fa-instagram"></i>
                </span>
            </a>

            <a href="https://www.twitter.com/" class="footer__social-link">
                <span class="footer__social-icon">
                    <i class="fab fa-twitter"></i>
                </span>
            </a>

            <a href="https://www.facebook.com/" class="footer__social-link">
                <span class="footer__social-icon">
                    <i class="fab fa-facebook"></i>
                </span>
            </a>

        </div>
        <!--` ---  -->



        <!--` Legal Text  -->
        <div class="footer__legal-text">
            &copy; 2020 DevCam | All rights reserved.
        </div>
        <!--` ---  -->


    </footer>

    <!--* ---------------------* End Of Footer *--------------------- -->



</body>

</html>
