<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- Font-awesome -->
  <script src="https://kit.fontawesome.com/a9c97bd30a.js" crossorigin="anonymous"></script>


  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">


  <!-- CSS  -->
  <link rel="stylesheet" href="/index.e8265c92.css">


  <!-- Js -->
  <script src="/index.18dbc454.js" defer=""></script>


  <title>Weather App</title>

</head>


<body>

  <!--* ***************************************  Header  *************************************** -->



  <!--* ***************************************  Main  *************************************** -->

  <main class="main fade-in">

    <h1 class="offscreen">Responsive Weather App powered by the open weather A P I</h1>

    <!-- $ *******************  Search-Bar  ******************* $ -->
    <section class="searchBar fade-in" id="searchBar">
      <form action="" class="searchBar__form" id="searchBar__form" role="search">
        <label for="searchBar__input" class="searchBar__label offscreen">Enter a new location</label>
        <input type="text" class="searchBar__input" id="searchBar__input" role="searchbox" size="40" autocomplete="off" placeholder="City, State, Country">
        <button type="submit" id="searchBar__btn" class="searchBar__btn btn" title="Submit Location" aria-label="Enter Zip Code or City,State or Country to retrieve weather conditions">
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fas fa-sync fa-spin none"></i>
        </button>
      </form>
    </section>
    <!-- $ *******************  End Of Search-Bar  ******************* $ -->

    <a href="#currentForecast" class="skip-link">Skip to Current Conditions</a>

    <!-- $ *******************  currentForecast  ******************* $ -->
    <section class="currentForecast fade-in" id="currentForecast" role="region" aria-labelledby="currentForecast__title">

      <h2 class="currentForecast__title" id="currentForecast__title">Current Conditions</h2>

      <div class="currentForecast__content" id="currentForecast__content"></div>

    </section>
    <!-- $ *******************  End Of currentForecast  ******************* $ -->

    <a href="#currentForecast" class="skip-link">Skip to 6-day Forecast</a>


    <!-- $ *******************  Nav  ******************* $ -->
    <nav class="nav fade-in" id="nav">

      <ul class="nav__list">

        <li class="nav__item">
          <button class="btn nav__link" id="nav__link--location" title="Get Location" aria-label="
          Get the current weather conditions for your current location">
            <i class="fas fa-map-marker-alt"></i>
            <i class="fas fa-sync fa-spin none"></i>
          </button>
        </li>

        <li class="nav__item">
          <button class="btn nav__link" id="nav__link--home" title="Home Weather" aria-label="
          Get the current weather conditions for your home location.">
            <i class="fas fa-home"></i>
            <i class="fas fa-sync fa-spin none"></i>
          </button>
        </li>

        <li class="nav__item">
          <button class="btn nav__link" id="nav__link--save-location" title="Save Location" aria-label="
          Save the current weather conditions as your home location.">
            <i class="fas fa-save"></i>
            <i class="fas fa-sync fa-spin none"></i>
          </button>
        </li>

        <li class="nav__item">
          <button class="btn nav__link" id="nav__link--unit" title="Toggle measurement units" aria-label="
          Toggle between metric and imperial units.">
            <i class="fas fa-chart-bar"></i>
            <i class="fas fa-sync fa-spin none"></i>
          </button>
        </li>

        <li class="nav__item">
          <button class="btn nav__link" id="nav__link--refresh" title="Refresh Weather" aria-label="
          Refresh current weather conditions">
            <i class="fas fa-sync-alt"></i>
            <i class="fas fa-sync fa-spin none"></i>
          </button>
        </li>


      </ul>

    </nav>
    <!-- $ *******************  End Of Nav  ******************* $ -->

    <hr class="fade-in">

    <!-- $ *******************  dailyForecast  ******************* $ -->
    <section class="dailyForecast fade-in" id="dailyForecast" role="region" aria-labelledby="dailyForecast__title">

      <h2 class="dailyForecast__title offscreen" id="dailyForecast__title">Six Day Forecast</h2>

      <div class="dailyForecast__content" id="dailyForecast__content"></div>

      <p class="offscreen" id="confirmation" aria-live="assertive"></p>

    </section>
    <!-- $ *******************  End Of dailyForecast  ******************* $ -->

  </main>

  <!--* ***************************************  End Of Main  *************************************** -->


</body>

</html>
